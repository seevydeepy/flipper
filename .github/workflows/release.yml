name: release

on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test
        run: dotnet test Flipper.sln -c Release

      - name: Publish
        run: pwsh -File scripts/publish.ps1

      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content artifacts/VERSION.txt -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'VERSION.txt is empty'
          }
          $tag = "v$version"
          $head = (git rev-parse HEAD).Trim()
          $existing = git rev-parse --verify --quiet $tag
          if ($LASTEXITCODE -eq 0) {
            if ($existing.Trim() -ne $head) {
              throw "tag $tag already points at $($existing.Trim())"
            }
          }
          else {
            git tag $tag
          }
          git push origin $tag
          $viewPrev = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          gh release view $tag 1>$null 2>$null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $viewPrev
          if ($releaseExists) {
            Write-Host "release $tag already exists"
            return
          }
          gh release create $tag `
            artifacts/Carousel-win-x64.zip `
            artifacts/Carousel-win-arm64.zip `
            artifacts/Carousel.Setup-win-x64.exe `
            artifacts/Carousel.Setup-win-arm64.exe `
            --generate-notes
        shell: pwsh
